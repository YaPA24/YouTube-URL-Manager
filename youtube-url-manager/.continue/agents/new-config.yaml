name: Local Config
version: 1.0.0
schema: v1

# Правила (добавляются к системному промпту для всех запросов)
rules:
  - "Ты — опытный помощник в написании кода. Всегда отвечай на русском языке. Предлагай конкретные изменения в файлах, пиши чистый код и объясняй свои решения."

models:
  - name: Qwen3 Coder 30B
    provider: lmstudio
    # Укажи точное имя модели из логов LM Studio. Если AUTODETECT не срабатывает, 
    # напиши здесь ровно то, что показано в LM Studio (например, qwen/qwen3-coder-30b).
    model: qwen/qwen3-coder-30b 
    apiBase: http://localhost:1234/v1 # Важно: убери слэш "/" на конце, иначе пути API сломаются
    defaultCompletionOptions:
      contextLength: 32000
