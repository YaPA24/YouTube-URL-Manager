name: Local Config
version: 1.0.0
schema: v1

systemMessage: Ты — помощник в написании кода. Отвечай на русском, предлагай изменения в файлах.

models:
  # --- Основная модель для Чата и Редактирования ---
  - name: Qwen3 Coder 30B
    provider: lmstudio
    # Убедись, что имя модели точно совпадает с тем, что выдает LM Studio (вкладка Developer -> Models)
    model: qwen/qwen3-coder-30b 
    apiBase: http://localhost:1234/v1/
    contextLength: 32000
    roles:
      - chat
      - edit
      - apply
      - summarize
    requestOptions:
      timeout: 120000

  # --- Легкая модель для быстрого Автодополнения (Tab) ---
  - name: Qwen2.5 Coder 3B (Autocomplete)
    provider: lmstudio
    model: qwen/qwen2.5-coder-3b-instruct # Предварительно скачай её в LM Studio
    apiBase: http://localhost:1234/v1/
    contextLength: 8000
    roles:
      - autocomplete

  # --- Модель для индексации файлов (@codebase) ---
  - name: Nomic Embed Text
    provider: lmstudio
    model: nomic-ai/nomic-embed-text-v1.5 # Предварительно скачай её в LM Studio
    apiBase: http://localhost:1234/v1/
    roles:
      - embed

