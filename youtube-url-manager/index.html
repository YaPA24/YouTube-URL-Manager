<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube URL Manager</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <div class="titlebar">
      <span class="titlebar__icon">&#9654;</span>
      <span class="titlebar__text">YouTube URL Manager</span>
    </div>
    <div class="toolbar">
      <div class="toolbar__left">
        <div class="tb-dropdown">
          <button class="tb-btn" id="menuManageBtn"><span class="tb-btn__icon">&#9881;</span><span class="tb-btn__label">Управление</span><span class="tb-btn__arrow">&#9662;</span></button>
          <div class="tb-dropdown__menu" id="menuManage">
            <button class="tb-dropdown__item" id="menuAddLink">Добавить ссылку...</button>
            <button class="tb-dropdown__item" id="menuAddGroup">Новая группа...</button>
            <div class="tb-dropdown__sep"></div>
            <button class="tb-dropdown__item" id="menuDeleteSelected">Удалить выбранное</button>
            <div class="tb-dropdown__sep"></div>
            <button class="tb-dropdown__item" id="menuRefreshMeta">Обновить все метаданные</button>
            <button class="tb-dropdown__item" id="menuHistory">История изменений...</button>
            <button class="tb-dropdown__item" id="menuSettings">Настройки API...</button>
          </div>
        </div>
        <div class="tb-dropdown">
          <button class="tb-btn" id="menuFilterBtn"><span class="tb-btn__icon">&#9638;</span><span class="tb-btn__label">Фильтр</span><span class="tb-btn__arrow">&#9662;</span></button>
          <div class="tb-dropdown__menu" id="menuFilter">
            <button class="tb-dropdown__item active" data-filter="all">Все видео</button>
            <div class="tb-dropdown__sep"></div>
            <button class="tb-dropdown__item" data-filter="queue">В очереди</button>
            <button class="tb-dropdown__item" data-filter="later">Посмотреть позже</button>
            <button class="tb-dropdown__item" data-filter="watching">Смотрю</button>
            <button class="tb-dropdown__item" data-filter="watched">Просмотрено</button>
            <button class="tb-dropdown__item" data-filter="archived">Архив</button>
          </div>
        </div>
        <div class="tb-dropdown">
          <button class="tb-btn" id="menuIoBtn"><span class="tb-btn__icon">&#8645;</span><span class="tb-btn__label">Импорт / Экспорт</span><span class="tb-btn__arrow">&#9662;</span></button>
          <div class="tb-dropdown__menu" id="menuIo">
            <button class="tb-dropdown__item" data-export="json">Экспорт JSON...</button>
            <button class="tb-dropdown__item" data-export="csv">Экспорт CSV...</button>
            <button class="tb-dropdown__item" data-export="markdown">Экспорт Markdown...</button>
            <button class="tb-dropdown__item" data-export="html">Экспорт HTML...</button>
            <div class="tb-dropdown__sep"></div>
            <button class="tb-dropdown__item" id="menuImportJson">Импорт JSON...</button>
            <button class="tb-dropdown__item" id="menuImportBookmarks">Импорт закладок...</button>
          </div>
        </div>
        <div class="tb-sep"></div>
        <button class="tb-icon-btn active" id="viewRowsBtn" title="Строки"><svg width="14" height="14" viewBox="0 0 14 14" fill="none"><rect y="0.5" width="14" height="2.5" rx="0.5" fill="currentColor"/><rect y="5.75" width="14" height="2.5" rx="0.5" fill="currentColor"/><rect y="11" width="14" height="2.5" rx="0.5" fill="currentColor"/></svg></button>
        <button class="tb-icon-btn" id="viewMosaicBtn" title="Мозаика"><svg width="14" height="14" viewBox="0 0 14 14" fill="none"><rect x="0.5" y="0.5" width="5.5" height="5.5" rx="0.7" fill="currentColor"/><rect x="8" y="0.5" width="5.5" height="5.5" rx="0.7" fill="currentColor"/><rect x="0.5" y="8" width="5.5" height="5.5" rx="0.7" fill="currentColor"/><rect x="8" y="8" width="5.5" height="5.5" rx="0.7" fill="currentColor"/></svg></button>
      </div>
      <div class="toolbar__right">
        <div class="toolbar__search">
          <span class="search-icon">&#128269;</span>
          <input type="text" id="searchInput" placeholder="Поиск в видео" autocomplete="off">
        </div>
      </div>
    </div>
    <div class="main">
      <div class="content">
        <div class="breadcrumb" id="breadcrumb"></div>
        <div class="content-body" id="contentBody">
          <div class="list-area" id="listArea">
            <div class="table-wrapper" id="tableWrapper">
              <div class="table-header" id="tableHeader">
                <div class="th th--icon"></div>
                <div class="th th--name" data-sort="title">Имя <span class="sort-arrow"></span></div>
                <div class="th th--channel" data-sort="channelTitle">Канал <span class="sort-arrow"></span></div>
                <div class="th th--duration" data-sort="durationSeconds">Длительность <span class="sort-arrow"></span></div>
                <div class="th th--published" data-sort="publishedAt">Опубликовано <span class="sort-arrow"></span></div>
                <div class="th th--url" data-sort="url">Адрес <span class="sort-arrow"></span></div>
              </div>
              <div class="table-body" id="tableBody"></div>
              <div class="table-empty hidden" id="tableEmpty"><span>Нет видео для отображения</span></div>
            </div>
            <div class="mosaic-view hidden" id="mosaicView"></div>
            <div class="mosaic-empty hidden" id="mosaicEmpty"><span>Нет видео для отображения</span></div>
          </div>
          <div class="resize-handle-v hidden" id="resizeHandleV"></div>
          <div class="details-panel" id="detailsPanel">
            <div class="details__thumb" id="detailsThumb"><img id="detailsThumbImg" src="" alt=""></div>
            <div class="details__fields">
              <div class="detail-row"><label>Имя</label><input type="text" id="detailName"></div>
              <div class="detail-row"><label>Адрес</label><input type="text" id="detailUrl" readonly></div>
              <div class="detail-row"><label>Канал</label><input type="text" id="detailChannel" readonly></div>
              <div class="detail-row detail-row--inline">
                <div class="detail-row__group"><label>Статус</label><select id="detailStatus"></select></div>
                <div class="detail-row__group"><label>Группа</label><select id="detailGroup"></select></div>
              </div>
              <div class="detail-row detail-row--inline">
                <div class="detail-row__group"><label>Длительность</label><input type="text" id="detailDuration" readonly></div>
                <div class="detail-row__group"><label>Опубликовано</label><input type="text" id="detailPublished" readonly></div>
              </div>
              <div class="detail-row"><label>Метки</label><input type="text" id="detailTags" placeholder="Разделяйте метки запятыми"><span class="detail-hint">Используйте метки для организации и поиска</span></div>
              <div class="detail-row"><label>Заметки</label><textarea id="detailNotes" rows="2" placeholder="Заметки к видео..."></textarea></div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="statusbar"><span id="statusText">Готово</span></div>
  </div>
  <div class="ctx-menu" id="ctxMenu">
    <div class="ctx-section ctx-link-section">
      <button class="ctx-menu__item" data-action="open">Открыть на YouTube</button>
      <button class="ctx-menu__item" data-action="refresh">Обновить метаданные</button>
      <div class="ctx-menu__sep"></div>
      <button class="ctx-menu__item" data-action="copy-url">Копировать URL</button>
      <button class="ctx-menu__item" data-action="copy-title">Копировать название</button>
      <div class="ctx-menu__sep"></div>
      <div class="ctx-menu__sub-wrap">
        <button class="ctx-menu__item ctx-menu__item--has-sub" id="ctxMoveToFolder">Переместить в папку &#9656;</button>
        <div class="ctx-menu__sub" id="ctxMoveSubmenu"></div>
      </div>
      <button class="ctx-menu__item" data-action="history">История изменений...</button>
      <div class="ctx-menu__sep"></div>
      <button class="ctx-menu__item ctx-menu__item--danger" data-action="delete">Удалить</button>
    </div>
    <div class="ctx-section ctx-folder-section">
      <button class="ctx-menu__item" data-action="rename-folder">Переименовать</button>
      <div class="ctx-menu__sep"></div>
      <button class="ctx-menu__item ctx-menu__item--danger" data-action="delete-folder">Удалить папку</button>
    </div>
  </div>
  <div id="modals"></div>
  <div class="toast-container" id="toastContainer"></div>
  <input type="file" id="fileInput" accept=".json,.html,.htm" class="hidden">
  <script src="js/storage.js"></script>
  <script src="js/youtube.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
